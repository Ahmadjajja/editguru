  --accent: var(--brand-accent, #c8f53a); --accent-ink: var(--brand-ink, #0a0b07); --accent-text: var(--brand-text-dark, #c8f53a); --accent-soft: var(--brand-soft-dark, #1d2410);

html { background: var(--bg); }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); font-size: 14px; line-height: 1.45; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 24px; }
* { box-sizing: border-box; }

:focus-visible { outline: 2px solid var(--accent-text); outline-offset: 2px; }

.grow { flex: 1 1 auto; }

.wrap { flex-wrap: wrap; }
.label { margin: 0; font: 600 11px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }

.btn-icon { display: inline-flex; align-items: center; justify-content: center; width: 36px; height: 36px; border-radius: 8px; background: transparent; border: 1px solid var(--line); color: var(--fg); font-weight: 700; }
.input { width: 100%; min-height: 36px; padding: 7px 10px; border-radius: 8px; background: var(--panel); border: 1px solid var(--line); color: var(--fg); }

/* Simple mode */
.simple { display: flex; flex-wrap: wrap; gap: 20px; padding-block: 18px; align-items: flex-start; }

.stage { flex: 0 1 332px; display: flex; flex-direction: column; gap: 10px; align-items: center; min-width: 0; margin-inline: auto; }

.tag { display: inline-block; padding: 1px 6px; border-radius: 4px; background: var(--panel-2); border: 1px solid var(--line); font: 500 10.5px/1.4 var(--mono); color: var(--muted); vertical-align: 1px; }
.blist { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }

.tc { color: var(--accent-text); font-weight: 600; }

.btn-play { flex: 0 0 auto; width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink); display: inline-flex; align-items: center; justify-content: center; }
.log { width: 100%; max-width: 360px; }

.log-list li { display: grid; grid-template-columns: 8px 70px minmax(0, 1fr); gap: 8px; align-items: baseline; font-size: 12.5px; }
.log-list .dot { width: 8px; height: 8px; border-radius: 50%; transform: translateY(1px); }
.log-list .who { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { height: 8px; border-radius: 4px; background: var(--panel-2); overflow: hidden; }

.result > div { flex: 1 1 160px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
details summary { cursor: pointer; font-size: 13px; color: var(--muted); }

/* Program monitor */
.monitor { position: relative; width: 300px; max-width: 100%; aspect-ratio: 9 / 16; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 0 0 1px var(--line); }
.mon-vid { position: absolute; inset: 0; }

.ov { position: absolute; inset: 0; pointer-events: none; }
.gap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; font-size: 12px; color: #9ba1aa; }

.caps { position: absolute; left: 5%; right: 5%; transform: translateY(-50%); display: flex; flex-wrap: wrap; justify-content: center; align-items: center; line-height: 1.15; text-align: center; pointer-events: none; }

.cur-tag { position: absolute; left: 14px; top: 16px; padding: 2px 6px; border-radius: 4px; color: #07080a; font: 700 10.5px/1.3 var(--mono); white-space: nowrap; }

.pro { display: flex; flex-direction: column; }

.mthumb .badge { position: absolute; right: 3px; bottom: 3px; padding: 1px 4px; border-radius: 3px; background: rgba(0,0,0,.75); color: #fff; font: 600 9.5px/1.3 var(--mono); }
.mname { font: 500 10.5px/1.25 var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.detail { padding: 10px; border-radius: 10px; background: var(--panel-2); display: flex; flex-direction: column; gap: 7px; }
.pre { white-space: pre-line; font: 400 11.5px/1.5 var(--mono); color: var(--muted); }
.pads { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.pad { display: flex; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); overflow: hidden; }
.pad-play { flex: 1 1 auto; display: flex; align-items: center; gap: 7px; min-height: 36px; padding: 0 9px; background: transparent; border: 0; font-size: 12.5px; font-weight: 600; text-align: left; }
.pad-play i { width: 8px; height: 8px; border-radius: 2px; }

.words { height: 170px; overflow-y: auto; padding: 8px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); display: flex; flex-wrap: wrap; align-content: flex-start; gap: 2px 3px; }
.w { padding: 1px 3px; border-radius: 3px; border: 0; background: transparent; font-size: 13px; line-height: 1.45; }
.w.cur { background: var(--accent); color: var(--accent-ink); }

.btn.danger { color: var(--danger); border-color: var(--danger); }
.plog { height: 160px; overflow-y: auto; display: flex; flex-direction: column; gap: 3px; padding: 6px 8px; border-radius: 10px; background: var(--panel); border: 1px solid var(--line); }
.plog > div { display: grid; grid-template-columns: 78px 8px 62px minmax(0, 1fr); gap: 6px; align-items: baseline; font-size: 11.5px; }
.plog .dot { width: 7px; height: 7px; border-radius: 50%; }
.scope { width: 100%; height: auto; border-radius: 8px; background: #050607; border: 1px solid var(--line); }
.mixrow { display: grid; grid-template-columns: 46px minmax(0, 1fr) 52px; align-items: center; gap: 8px; font-size: 12px; }
.meter { height: 6px; border-radius: 3px; background: var(--panel-2); overflow: hidden; }
.meter > div { height: 100%; background: #3fbf7a; transition: width .08s linear; }
.wheels { display: flex; justify-content: space-between; gap: 8px; }
.wheel { display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 11px; }
.wheel button { position: relative; width: 70px; height: 70px; padding: 0; border-radius: 50%; border: 1px solid var(--line); background: radial-gradient(circle, rgba(118,118,118,1) 0%, rgba(118,118,118,0) 70%), conic-gradient(#ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #ff00ff, #ff0000); cursor: crosshair; touch-action: none; }
.wheel button i { position: absolute; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 2px rgba(0,0,0,.55); }
.wheel .val { font-family: var(--mono); color: var(--muted); }

.slrow { display: grid; grid-template-columns: 74px minmax(0, 1fr) 36px; align-items: center; gap: 8px; font-size: 12.5px; }
.look { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); }
.look.on { border-color: #c06a2c; }
.g2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); padding: 0; }
.swatch.on { outline: 2px solid var(--fg); outline-offset: 2px; }
.rolegrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px 12px; }

      ctx.drawImage(this.wmImg, right - w, y + (h - hh) / 2, w, hh);
    } else if (BRAND.logo === 'monogram') {
      roundRect(ctx, right - h, y, h, h, h * 0.25);
      ctx.fillStyle = BRAND.accent; ctx.fill();
      ctx.fillStyle = brandTokens(BRAND).ink;
      ctx.font = '800 ' + (h * 0.55).toFixed(1) + "px '" + BRAND.displayFont + "', sans-serif";
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.fillText(BRAND.name.charAt(0).toUpperCase(), right - h / 2, y + h / 2);
    } else if (BRAND.logo === 'mark') {
      ctx.translate(right - h, y);
      ctx.scale(h / 24, h / 24);
      ctx.beginPath(); ctx.moveTo(12, 2); ctx.lineTo(22, 12); ctx.lineTo(12, 22); ctx.lineTo(2, 12); ctx.closePath();
      ctx.lineWidth = 2.4; ctx.strokeStyle = '#ffffff'; ctx.stroke();
      ctx.beginPath(); ctx.moveTo(12, 8); ctx.lineTo(16, 12); ctx.lineTo(12, 16); ctx.lineTo(8, 12); ctx.closePath();
      ctx.fillStyle = BRAND.accent; ctx.fill();
    }
    ctx.restore();
  }
  brandMark(onVideo) {
    const b = BRAND;
    if (b.logo === 'mark') {
      return html`<svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2 22 12 12 22 2 12Z" fill="none" stroke=${onVideo ? '#ffffff' : 'currentColor'} stroke-width="2.4"></path><path d="M12 8 16 12 12 16 8 12Z" style="fill: var(--accent)"></path></svg>`;
    }
    if (b.logo === 'monogram') return html`<span class="monogram" aria-hidden="true">${b.name.charAt(0).toUpperCase()}</span>`;
    return html`<img class=${onVideo ? '' : 'logo-img'} src=${b.logo} alt="" />`;

  render() {

    return html`<div class="app" data-swarm-root="1">
      ${this.header(v, s, pro)}
      ${pro ? this.proView(v, s) : this.simpleView(v, s)}
      ${this.cursorLayer(v)}
      ${pro && v.rOpen ? this.renderModal(v) : null}
      ${s.help ? this.helpPanel(pro) : null}
      ${s.brandOpen ? this.brandPanel(s) : null}

  }

  simpleView(v, s) {

          </div>
          ${(s.copyNote || s.srtNote) ? html`<p class="small muted" style="margin:0">${s.srtNote || s.copyNote}</p>` : null}
          <details data-srt-wrap="1"><summary>Show captions</summary>
            <label for="srt" class="sr-only">Captions in SRT format</label>
            <textarea id="srt" data-srt="1" class="input mono" rows="8" readonly value=${this.srtText()}></textarea>
          </details>
        </div>
      </section>
      ${BRAND.poweredBy ? html`<p class="powered" style="flex-basis:100%">${BRAND.poweredBy}</p>` : null}
    </main>`;
  }

  proView(v, s) {
    const sm = v.sm;
    return html`<main class="pro">
      <div class="pro-main">
        <section class="col col-media" data-area="media" aria-label="Media">
          <div class="head-row"><h2 class="label">Media pool</h2><span class="small muted mono">${v.mediaCount} items</span></div>
          <div class="mgrid">${v.mediaItems.map((m) => html`<button type="button" class=${'mitem' + (m.border === '#c8f53a' ? ' on' : '')} aria-label=${m.aria} aria-pressed=${m.border === '#c8f53a' ? 'true' : 'false'} onClick=${m.pick}>
            <span class="mthumb" style=${'aspect-ratio:' + m.aspect}>${m.hasThumb ? html`<img src=${m.thumb} alt="" />` : null}<span class="badge">${m.badge}</span></span>
            <span class="mname">${m.name}</span>
          </button>`)}</div>
          ${sm.on ? html`<div class="detail">
            <div class="fname small mono">${sm.name}</div>
            <div class="pre">${sm.info}</div>
            ${sm.isVideo ? html`<div class="row wrap"><button type="button" class="btn-primary" style="min-height:32px;font-size:12.5px" onClick=${sm.newEdit}>New edit from this</button><button type="button" class="btn sm" onClick=${sm.insert}>Insert at playhead</button></div>` : null}
            ${sm.isImage ? html`<label class="small muted" for="cue-detail">Cue words (comma separated)</label><input id="cue-detail" class="input sm mono" value=${sm.cues} onInput=${sm.setCues} /><button type="button" class="btn sm" onClick=${sm.addImage}>Add to B-roll at playhead</button>` : null}
            ${sm.isAudio ? html`<button type="button" class="btn sm" onClick=${sm.useMusic}>Use as music bed</button>` : null}
          </div>` : null}
          <p class="small muted" style="margin:0">Import a video, B-roll images, music and a transcript (.srt, .vtt or Whisper .json), or drop files anywhere. Files stay in this tab.</p>
          <div data-area="sfx" style="display:flex;flex-direction:column;gap:8px">
            <h2 class="label">Sound FX</h2>
            <div class="pads">${v.sfxPads.map((p) => html`<div class="pad">
              <button type="button" class="pad-play" aria-label=${p.playLabel} onClick=${p.play}><i style=${'background:' + p.color}></i>${p.name}</button>
              <button type="button" class="pad-add" aria-label=${p.addLabel} onClick=${p.add}>+</button>
            </div>`)}</div>
          </div>
        </section>

        <section class="col col-text" aria-label="Transcript and agents">
          <div data-area="transcript" style="display:flex;flex-direction:column;gap:8px">
            <div class="head-row"><h2 class="label">Transcript</h2><span class="small muted mono">${v.twCount} words in edit</span></div>
            <div class="words">
              ${v.tw.map((w) => html`<button type="button" class=${'w' + (w.bg === '#4a2020' ? ' sel' : w.bg === '#c8f53a' ? ' cur' : '')} onClick=${w.click}>${w.text}</button>`)}
              ${v.twEmpty ? html`<p class="small muted" style="margin:0">No transcript on the A-roll. Select the video in the media pool, then import its .srt, .vtt or Whisper .json.</p>` : null}
            </div>
            <div class="row wrap">
              <button type="button" class=${'btn sm' + (v.cutSelOff ? '' : ' danger')} disabled=${v.cutSelOff} onClick=${v.cutSel}>${v.cutSelLabel}</button>
              <span class="small muted">Click a word to jump. Shift-click to select a range.</span>
            </div>
          </div>
          <div data-area="agentbar" style="display:flex;flex-direction:column;gap:7px">
            <h2 class="label">Tell the agents</h2>
            <div class="row">
              <label for="cmd" class="sr-only">Command for the agents</label>
              <input id="cmd" class="input" value=${v.cmd} placeholder="edit this in one click" onInput=${v.setCmd} onKeyDown=${v.cmdKey} />
              <button type="button" class="btn-primary" onClick=${v.submitCmd}>Run</button>
            </div>
            <div class="row wrap" style="gap:5px">${v.chips.map((c) => html`<button type="button" class="chip" onClick=${c.use}>${c.text}</button>`)}</div>
          </div>
          <div data-area="activity" style="display:flex;flex-direction:column;gap:6px">
            <div class="head-row"><h2 class="label">Activity</h2><span class="small muted mono">${v.editsText}</span></div>
            <div class="plog mono">${v.logs.map((lg) => html`<div><span class="muted">${lg.tc}</span><span class="dot" style=${'background:' + lg.color}></span><span class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${lg.who}</span><span>${lg.text}</span></div>`)}</div>
          </div>
        </section>

        <section class="col col-prog" aria-label="Program monitor">
          <div class="mon-head"><h2 class="label">Program</h2><span class="mono small tc">${v.tcNow}</span></div>
          ${this.monitor(v)}
          <div class="mon-head small muted mono"><span>${v.progLeft}</span><span>${v.progRight}</span></div>
        </section>

        <section class="col col-scope" data-area="scopes" aria-label="Scopes and mix">
          <h2 class="label">Waveform · luma</h2>
          <canvas class="scope" data-scope="wave" width="220" height="118" role="img" aria-label="Luma waveform of the current frame"></canvas>
          <h2 class="label">Vectorscope</h2>
          <canvas class="scope" data-scope="vec" width="220" height="150" role="img" aria-label="Vectorscope of the current frame"></canvas>
          <p class="small muted" style="margin:0;min-height:34px">${v.scopeNote}</p>
          <div data-area="mix" style="display:flex;flex-direction:column;gap:8px;margin-top:auto">
            <h2 class="label">Mix</h2>
            ${v.mixRows.map((mx, i) => html`<div class="mixrow"><label for=${'mix-' + i}>${mx.label}</label><input id=${'mix-' + i} type="range" min=${mx.min} max=${mx.max} step="1" value=${mx.value} onInput=${mx.change} /><span class="mono" style="text-align:right">${mx.text}</span></div>`)}
            <div class="head-row small"><span class="muted">SFX + music bus</span><span class="mono">${v.meterText}</span></div>
            <div class="meter"><div style=${'width:' + v.meterW}></div></div>
          </div>
        </section>

        <section class="col col-right" aria-label="Color, captions and agents">
          <div data-area="color" style="display:flex;flex-direction:column;gap:9px">
            <div class="head-row"><h2 class="label">Color</h2><button type="button" class="btn sm" onClick=${v.resetGrade}>Reset</button></div>
            <div class="wheels">${v.wheels.map((wh) => html`<div class="wheel">
              <button type="button" aria-label=${wh.aria} onPointerDown=${wh.down} onDblClick=${wh.reset}><i style=${'left:' + wh.x + ';top:' + wh.y}></i></button>
              <span style="font-weight:600">${wh.label}</span>
              <span class=${'val' + (wh.val === '0.00' ? '' : ' on')}>${wh.val}</span>
            </div>`)}</div>
            ${v.sliders.map((sl, i) => html`<div class="slrow"><label for=${'gr-' + i}>${sl.label}</label><input id=${'gr-' + i} type="range" min="-100" max="100" step="1" value=${sl.value} onInput=${sl.change} /><span class="mono small" style="text-align:right">${sl.text}</span></div>`)}
            <div class=${'look' + (v.lookOn ? ' on' : '')}>
              <label class="row" for="look-on" style="font-weight:600;font-size:13px"><input id="look-on" type="checkbox" checked=${v.lookOn} onChange=${v.toggleLook} />Warm Commercial look</label>
              <label class="sr-only" for="look-amt">Look strength</label>
              <input id="look-amt" type="range" min="0" max="100" step="1" value=${v.lookAmt} onInput=${v.setLookAmt} style="flex:1 1 100px;width:auto" />
              <span class="mono small">${v.lookAmt}%</span>
            </div>
          </div>
          <div data-area="captions" style="display:flex;flex-direction:column;gap:8px">
            <div class="head-row"><h2 class="label">Captions</h2><span class="small muted">word by word</span></div>
            <div class="g2">${v.capStyles.map((cs) => html`<button type="button" class=${'chip' + (cs.pressed === 'true' ? ' on' : '')} aria-pressed=${cs.pressed} onClick=${cs.pick}>${cs.label}</button>`)}</div>
            <div class="g2">
              <div><label class="small muted" for="cap-font">Font</label><select id="cap-font" class="input sm" value=${v.capFont} onChange=${v.setCapFont}>
                <option value="inter">Inter Black</option><option value="grotesk">Space Grotesk</option><option value="bebas">Bebas Neue</option><option value="marker">Permanent Marker</option><option value="fraunces">Fraunces Black</option>
              </select></div>
              <div><label class="small muted" for="cap-per">Words per caption</label><select id="cap-per" class="input sm" value=${v.capPer} onChange=${v.setCapPer}>
                <option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option>
              </select></div>
            </div>
            <div class="row wrap">
              <span class="small muted">Highlight</span>
              ${v.swatches.map((sw) => html`<button type="button" class=${'swatch' + (sw.ring === '#ffffff' ? ' on' : '')} aria-label=${sw.aria} aria-pressed=${sw.ring === '#ffffff' ? 'true' : 'false'} style=${'background:' + sw.color} onClick=${sw.pick}></button>`)}
              <span class="grow"></span>
              ${v.posBtns.map((pb) => html`<button type="button" class=${'chip' + (pb.bg === '#1d2410' ? ' on' : '')} aria-pressed=${pb.bg === '#1d2410' ? 'true' : 'false'} onClick=${pb.pick}>${pb.label}</button>`)}
            </div>
          </div>
          <div data-area="swarm" style="display:flex;flex-direction:column;gap:8px">
            <div class="head-row"><h2 class="label">Agents</h2><span class="small muted mono">10 agents · 6 roles</span></div>
            <div class="rolegrid">${v.roleRows.map((rr, i) => html`<label for=${'prole-' + i}>
              <input id=${'prole-' + i} type="checkbox" checked=${rr.checked} onChange=${rr.toggle} />
              <span>${rr.label}</span>
              <span class="bar"><i style=${'width:' + rr.barW + ';background:' + rr.color}></i></span>
              <span class="mono" style="text-align:right">${rr.count}</span>
            </label>`)}</div>
            <div class="slrow" style="grid-template-columns: 110px minmax(0,1fr) 44px"><label for="minpause">Cut pauses over</label><input id="minpause" type="range" min="15" max="120" step="5" value=${v.minPauseVal} onInput=${v.setMinPause} /><span class="mono small">${v.minPauseText}</span></div>
            <div class="slrow" style="grid-template-columns: 110px minmax(0,1fr) 44px"><label for="thr">Quiet below</label><input id="thr" type="range" min="-60" max="-20" step="1" value=${v.thrDb} onInput=${v.setThr} /><span class="mono small">${v.thrText}</span></div>
            <button type="button" class="btn-primary" style="min-height:44px" disabled=${v.swarmOn} onClick=${v.runOneClick}>${v.runLabel}</button>
            <p class="small muted" style="margin:0">The agents are rule-based routines running in this tab: no AI model and no uploads. Pauses come from the audio level, or from word timings when a clip has no audio.</p>
          </div>
        </section>
      </div>

      <section class="tl" data-area="timeline" aria-label="Timeline">
        <div class="tl-bar">
          <button type="button" class="btn-icon" aria-label="Go to start" onClick=${v.toStart}>${ICON.start}</button>
          <button type="button" class="btn sm mono" aria-label="Back one frame" onClick=${v.stepBack}>-1</button>
          <button type="button" class="btn-play" style="width:40px;height:36px;border-radius:8px" aria-label=${v.playLabel} onClick=${v.togglePlay}>${v.playing ? ICON.pause : ICON.play}</button>
          <button type="button" class="btn sm mono" aria-label="Forward one frame" onClick=${v.stepFwd}>+1</button>
          <span class="mono tc" style="font-size:17px;margin-left:6px">${v.tcNow}</span>
          <span class="mono small muted">/ ${v.tcEnd}</span>
          <span class="mono small muted" style="margin-left:6px;letter-spacing:.08em">${v.playState}</span>
          <span class="grow"></span>
          <button type="button" class=${'btn sm' + (v.selPressed === 'true' ? ' on' : '')} aria-pressed=${v.selPressed} onClick=${v.toolSel}>Select</button>
          <button type="button" class=${'btn sm' + (v.razorPressed === 'true' ? ' on' : '')} aria-pressed=${v.razorPressed} onClick=${v.toolRazor}>Razor</button>
          <button type="button" class="btn sm" onClick=${v.splitHere}>Split at playhead</button>
          <button type="button" class="btn sm" disabled=${v.delOff} onClick=${v.delSel}>Delete clip</button>
          <button type="button" class=${'btn sm' + (v.ripplePressed === 'true' ? ' on' : '')} aria-pressed=${v.ripplePressed} onClick=${v.toggleRipple}>Ripple</button>
          <button type="button" class=${'btn sm' + (v.snapPressed === 'true' ? ' on' : '')} aria-pressed=${v.snapPressed} onClick=${v.toggleSnap}>Snap</button>
          <label class="row small muted" for="zoom">Zoom <input id="zoom" type="range" min="8" max="90" step="1" value=${v.zoom} onInput=${v.setZoom} style="width:100px" /></label>
        </div>
        <div class="tl-body">
          <div class="tl-heads">
            <div style="height:24px;border-bottom:1px solid var(--line)"></div>
            ${v.trackHeads.map((th) => html`<div class="tl-head">
              <i style=${'background:' + th.color}></i>
              <span class="nm"><b>${th.name}</b><small>${th.sub}</small></span>
              <button type="button" class=${'trk' + (th.state === 'OFF' ? ' off' : '')} aria-label=${th.aria} onClick=${th.toggle}>${th.state}</button>
            </div>`)}
          </div>
          <div class="tl-scroll" data-tl-scroll="1">
            <div class="tl-inner" style=${'width:' + v.laneW}>
              <button type="button" class="ruler" aria-label="Timeline ruler: click or drag to move the playhead" onPointerDown=${v.rulerDown}>
                ${v.ticks.map((tk) => html`<span class="tick" style=${'left:' + tk.left}>${tk.label}</span>`)}
              </button>
              <div class="lane" data-lane="t1">${v.lt1.map((c) => html`<button type="button" class="clip c-t1" style=${'left:' + c.left + ';width:' + c.width + ';opacity:' + c.op} aria-label=${c.aria} onClick=${c.click}>${c.label}</button>`)}</div>
              ${[['s1', v.ls1], ['v2', v.lv2], ['v1', v.lv1], ['fx', v.lfx]].map((ln) => html`<div class="lane" data-lane=${ln[0]}>${ln[1].map((c) => this.clipBtn(c, ln[0]))}</div>`)}
              <div class="lane" data-lane="a1">${v.la1.map((c) => html`<div class="clip c-a1" style=${'left:' + c.left + ';width:' + c.width + ';opacity:' + c.op}>${c.label}</div>`)}</div>
              <div class="lane" data-lane="a2">${v.la2.map((c) => this.clipBtn(c, 'a2'))}</div>
              <div class="playhead" aria-hidden="true" style=${'left:' + v.playX}></div>
            </div>
          </div>
        </div>
      </section>
      <footer class="status mono">
        <span>${v.stClips}</span><span>${v.stEdits}</span><span>${v.stDur}</span><span>${v.stFps}</span>
        <span class="grow"></span>
        <span>Session only: imported files are not uploaded and are gone when this tab closes.</span>
        ${BRAND.poweredBy ? html`<span>${BRAND.poweredBy}</span>` : null}
      </footer>
    </main>`;
  }

  clipBtn(c, tr) {
    return html`<button type="button" class=${'clip c-' + tr + (c.border === '#c8f53a' ? ' is-sel' : '')} style=${'left:' + c.left + ';width:' + c.width + ';opacity:' + c.op + ';cursor:' + c.cursor} aria-label=${c.aria} onPointerDown=${c.down} onClick=${c.pick}>${c.label}</button>`;
  }

  renderModal(v) {
    return html`<div class="modal-back">
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="render-title">
        <div class="head-row"><h2 id="render-title">Render</h2><button type="button" class="btn sm" onClick=${v.closeRender}>Close</button></div>
        <p class="small muted" style="margin:0">${v.rIntro}</p>
        <div class="row wrap">
          <label class="small" for="rsize-pro">Size</label>
          <select id="rsize-pro" class="input sm" style="width:auto" value=${v.rRes} onChange=${v.setRes}><option value="720">720 × 1280</option><option value="1080">1080 × 1920</option></select>
          <button type="button" class="btn-primary" disabled=${v.rBusy} onClick=${v.startRender}>Start render</button>
          ${v.rBusy ? html`<button type="button" class="btn" onClick=${v.cancelRender}>Cancel</button>` : null}
        </div>
        ${v.rBusy ? html`<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow=${parseInt(v.rProgW, 10)}><div style=${'width:' + v.rProgW}></div></div><span class="small muted mono">${v.rProgText}</span>` : null}
        ${v.rErrOn ? html`<p class="err">${v.rErr}</p>` : null}
        ${v.rFilterWarnOn ? html`<p class="warn small">${v.rFilterWarn}</p>` : null}
        ${v.rOut.on ? html`<div class="result">
          <video class="result-video" src=${v.rOut.url} controls=${true} playsinline></video>
          <div><div class="fname mono small">${v.rOut.name}</div><div class="small muted mono">${v.rOut.meta}</div>
          <button type="button" class="btn-primary" onClick=${v.download}>Save video</button>
          <p class="small muted" style="margin:0">${v.rNote}</p></div>
        </div>` : null}
        <div class="head-row"><h2 class="label">Captions for this edit (.srt)</h2><div class="row"><button type="button" class="btn sm" onClick=${v.copySrt}>Copy</button><button type="button" class="btn sm" onClick=${this.saveSrt}>Save</button></div></div>
        <label for="srt-pro" class="sr-only">Captions in SRT format</label>
        <textarea id="srt-pro" data-srt="1" class="input mono" rows="6" readonly value=${v.srtText}></textarea>
        <span class="small muted">${this.state.srtNote || v.copyNote}</span>
      </div>
    </div>`;
  }

  helpPanel(pro) {
    const rows = [['Space', 'Play or pause'], ['← →', 'Step one frame'], ['Shift + ← →', 'Jump one second'], ['Home / End', 'Go to start or end'], ['Ctrl/⌘ + Z', 'Undo'], ['Ctrl/⌘ + Shift + Z', 'Redo']];
    if (pro) { rows.push(['S', 'Split at the playhead']); rows.push(['Delete', 'Delete the selected clip']); }
    rows.push(['Esc', 'Close this panel']);
    return html`<div class="modal-back" onClick=${(e) => { if (e.target === e.currentTarget) this.setState({ help: false }); }}>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="keys-title" style="max-width:420px">
        <div class="head-row"><h2 id="keys-title">Keyboard shortcuts</h2><button type="button" class="btn sm" onClick=${() => this.setState({ help: false })}>Close</button></div>
        <dl class="keys">${rows.map((r) => html`<dt><kbd>${r[0]}</kbd></dt><dd>${r[1]}</dd>`)}</dl>
      </div>
    </div>`;
  }
}

render(html`<${App} />`, document.getElementById('app'));

</script>

</body></html>
