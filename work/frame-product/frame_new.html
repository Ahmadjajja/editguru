<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New footage · Frame</title><style>
:root{font:15px -apple-system,BlinkMacSystemFont,sans-serif;color-scheme:light dark}body{max-width:640px;margin:10vh auto;padding:24px;line-height:1.6}h1{font-size:32px;letter-spacing:-.04em;margin-bottom:8px}p{opacity:.75}#drop{border:2px dashed #8885;border-radius:16px;padding:32px;margin:24px 0}#drop.active{border-color:#5280e8;background:#5280e811}input,button,a{font:inherit;color:inherit}input{max-width:100%}button,a{padding:10px 16px;border:1px solid #8885;border-radius:8px;background:transparent;cursor:pointer}progress{width:100%}[hidden]{display:none!important}#status{opacity:1;min-height:28px;overflow-wrap:anywhere}.brand{font-weight:650;letter-spacing:.1em;font-size:12px;opacity:.6}
</style></head><body><div class="brand">FRAME</div><h1>Start with new footage</h1><p>Select a video to create a new project. Once it’s saved, return to your Frame panel to begin editing.</p><div id="drop"><label for="footage"><strong>Drop a video here or choose a file</strong></label><p><input id="footage" type="file" accept="video/*,.mov,.mp4,.m4v,.webm,.mkv"></p><small>One video, up to 700 MB.</small></div><progress id="progress" value="0" max="100" hidden></progress><p id="status" role="status" aria-live="polite"></p><button id="retry" hidden>Retry upload</button><p><a id="open" hidden>Open this project here</a></p><script>
const $=id=>document.getElementById(id),session=new URL(location.href).searchParams.get('session');let busy=false,saved=false,lastFile=null;
function upload(file){if(busy||saved||!file)return;if(!/^[a-f0-9]{32}$/.test(session||''))return $('status').textContent='Open a new upload from Frame.';if(!file.size||file.size>700*1024*1024)return $('status').textContent='Choose a video between 1 byte and 700 MB.';lastFile=file;busy=true;$('footage').disabled=true;$('retry').hidden=true;$('progress').hidden=false;$('status').textContent='Uploading '+file.name+'…';const xhr=new XMLHttpRequest();xhr.open('POST','/api/frame/start/'+session);xhr.setRequestHeader('Content-Type',file.type||'application/octet-stream');xhr.setRequestHeader('X-Filename',encodeURIComponent(file.name));xhr.timeout=360000;xhr.upload.onprogress=e=>{if(e.lengthComputable){const percent=Math.round(e.loaded/e.total*100);$('progress').value=percent;$('status').textContent=percent===100?'Upload received. Preparing your project…':'Uploading '+file.name+' · '+percent+'%'}};function finish(error){busy=false;$('progress').hidden=true;$('footage').disabled=false;if(error){$('status').textContent=error+' Your file selection is kept; retry when ready.';$('retry').hidden=false}}xhr.onload=()=>{try{const r=JSON.parse(xhr.responseText);if(xhr.status!==200)throw Error(r.error||'Upload failed.');if(r.upload_session_id!==session||! /^[a-f0-9]{32}$/.test(r.project_id))throw Error('Project confirmation did not match this upload.');saved=true;$('footage').disabled=true;$('drop').hidden=true;$('open').href=r.editor_url;$('open').hidden=false;finish();$('status').textContent='Saved. Return to your Frame panel—your new project will open there.'}catch(e){finish(e.message)}};xhr.onerror=()=>finish('Connection interrupted.');xhr.ontimeout=()=>finish('Upload confirmation timed out.');xhr.send(file)}
$('footage').onchange=()=>upload($('footage').files[0]);$('retry').onclick=()=>upload(lastFile);for(const event of ['dragenter','dragover'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.add('active')});for(const event of ['dragleave','drop'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.remove('active')});$('drop').addEventListener('drop',e=>{const files=[...e.dataTransfer.files];if(files.length!==1)$('status').textContent='Choose one video for this new project.';else upload(files[0])});if(!/^[a-f0-9]{32}$/.test(session||'')){$('footage').disabled=true;$('status').textContent='Open this upload page using Add new footage in Frame.'}
</script></body></html>
