<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add to Frame project</title><style>
:root{font:15px -apple-system,BlinkMacSystemFont,sans-serif;color-scheme:light dark}body{max-width:760px;margin:40px auto;padding:0 20px;line-height:1.5}h1{font-size:26px;letter-spacing:-.03em}button,input,textarea{font:inherit;color:inherit;background:transparent;border:1px solid #8886;border-radius:8px;padding:10px}button{cursor:pointer}button:disabled{opacity:.5;cursor:default}#drop{border:2px dashed #8886;border-radius:14px;padding:30px;margin:20px 0}#drop.active{border-color:#6898ed;background:#6898ed15}textarea{width:100%;box-sizing:border-box;min-height:90px}li{margin:12px 0;padding:12px;border:1px solid #8884;border-radius:9px;list-style:none}ul{padding:0}small{opacity:.65}progress{width:100%;margin:12px 0}#status{min-height:25px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}a{color:inherit}
</style><h1>Add to this project</h1><p id="projectName">Loading project…</p><p>Re-recordings, extra footage, images, audio and documents stay with this project. Your current cut remains available.</p><div id="drop"><label for="files">Drop files here or choose files</label><p><input id="files" type="file" multiple></p><small>Up to 700 MB per file. Files are saved before you choose how to use them.</small></div><label for="brief">New direction or instructions <small>(optional)</small></label><textarea id="brief" maxlength="2000" placeholder="What should change? What does the new material add?"></textarea><p><button id="saveContext">Save instructions to project</button></p><progress id="progress" max="100" value="0" hidden></progress><p id="status" role="status"></p><ul id="saved"></ul><p><a id="returnLink">Return to Frame</a></p><script>
const $=id=>document.getElementById(id),pid=new URL(location.href).searchParams.get('project');let current=null,working=false;
async function tool(name,args){const response=await fetch('/api/frame/tools',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,arguments:args})});const result=await response.json();if(!response.ok||result.isError)throw Error(result.content?.find(c=>c.type==='text')?.text||result.error||'Frame request failed');return result.structuredContent}
function row(asset){if(document.querySelector('[data-asset="'+asset.id+'"]'))return;const item=document.createElement('li');item.dataset.asset=asset.id;const name=document.createElement('strong'),state=document.createElement('p');name.textContent=asset.name;state.textContent='Saved inside this project';item.append(name,state);
if(asset.mime_type?.startsWith('video/')||/\.(mp4|mov|m4v|webm|mkv)$/i.test(asset.name)){const button=document.createElement('button');button.textContent='Start a new cut from this take';let requestId=null;button.onclick=async()=>{if(working)return;working=true;button.disabled=true;requestId ||= crypto.randomUUID();try{const doc=await tool('get_project',{project_id:pid}),result=await tool('start_project_revision',{project_id:pid,expected_version:doc.version,asset_id:asset.id,request_id:requestId,brief:$('brief').value});state.textContent='New cut saved in the same project. Earlier versions are preserved.';const link=document.createElement('a');link.href='/frame?project='+result.project_id;link.textContent='Open the new cut';item.append(link);requestId=null}catch(e){$('status').textContent=e.message}finally{working=false;button.disabled=false}};item.append(button)}$('saved').prepend(item)}
function upload(file){return new Promise((resolve,reject)=>{const xhr=new XMLHttpRequest();xhr.open('POST','/api/quick/projects/'+pid+'/assets');xhr.setRequestHeader('Content-Type','application/octet-stream');xhr.setRequestHeader('X-Filename',encodeURIComponent(file.name));xhr.upload.onprogress=event=>{if(event.lengthComputable)$('progress').value=Math.round(event.loaded/event.total*100)};xhr.onerror=()=>reject(Error('Connection interrupted. Check the saved files before retrying.'));xhr.onload=()=>{try{const doc=JSON.parse(xhr.responseText);if(xhr.status!==200)throw Error(doc.error||'Upload failed');resolve(doc)}catch(e){reject(e)}};xhr.send(file)})}
async function add(files){if(working||!current)return;working=true;$('files').disabled=true;$('progress').hidden=false;try{for(const file of files){if(!file.size||file.size>700*1024*1024)throw Error(file.name+': choose a file between 1 byte and 700 MB.');$('status').textContent='Uploading '+file.name+'…';$('progress').value=0;current=await upload(file);const asset=current.assets.find(a=>a.id===current.uploaded_asset_id)||current.assets.at(-1);row(asset)}$('status').textContent='Files saved. Return to Frame, or start a new cut from a re-recording.'}catch(e){$('status').textContent=e.message}finally{working=false;$('files').disabled=false;$('progress').hidden=true;$('files').value=''}}
$('saveContext').onclick=async()=>{if(working||!current||!$('brief').value.trim())return;working=true;$('saveContext').disabled=true;try{const doc=await tool('get_project',{project_id:pid});current=await tool('update_editor',{project_id:pid,expected_version:doc.version,action:'add_general_note',instruction:$('brief').value.trim()});$('status').textContent='Instructions saved with this project’s general revisions.'}catch(e){$('status').textContent=e.message}finally{working=false;$('saveContext').disabled=false}};
$('files').onchange=()=>add([...$('files').files]);for(const event of ['dragenter','dragover'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.add('active')});for(const event of ['dragleave','drop'])$('drop').addEventListener(event,e=>{e.preventDefault();$('drop').classList.remove('active')});$('drop').addEventListener('drop',e=>add([...e.dataTransfer.files]));
(async()=>{try{if(!/^[a-f0-9]{32}$/.test(pid||''))throw Error('Open this upload page from the intended Frame project.');current=await tool('get_project',{project_id:pid});$('projectName').textContent=current.work_project?.title||current.name;$('returnLink').href='/frame?project='+pid;for(const asset of current.assets||[])row(asset)}catch(e){$('status').textContent=e.message;$('files').disabled=true}})();
</script>
